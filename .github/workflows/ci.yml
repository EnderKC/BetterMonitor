name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
      - name: Run race tests
        run: go test -race ./...

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
      - name: Run race tests
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm run test:run
      - name: Build frontend
        run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n install-agent.sh uninstall-agent.sh install-dashboard.sh tests/install-agent-contract.sh tests/release-version-contract.sh .github/scripts/validate-agent-version.sh
      - name: Verify installer release contract
        run: bash tests/install-agent-contract.sh
      - name: Verify release workflow version contract
        run: bash tests/release-version-contract.sh

  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum
      - name: Verify PowerShell installer contract
        shell: pwsh
        run: ./tests/install-agent-contract.ps1
      - name: Test Windows updater contract
        shell: pwsh
        working-directory: agent
        run: go test ./internal/upgrader -run 'TestWindowsUpdaterScript' -count=1
      - name: Compile Windows Agent packages
        shell: pwsh
        working-directory: agent
        run: go test ./...
